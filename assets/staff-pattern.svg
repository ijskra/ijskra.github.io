<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">

<defs>
  <pattern id="staff" width="1440" height="69.55" patternUnits="userSpaceOnUse">
    <g fill="#c2c3c6"><rect x="0" y="20.00" width="1440" height="0.8"></rect><rect x="0" y="26.50" width="1440" height="0.8"></rect><rect x="0" y="33.00" width="1440" height="0.8"></rect><rect x="0" y="39.50" width="1440" height="0.8"></rect><rect x="0" y="46.00" width="1440" height="0.8"></rect></g>
  </pattern>
  <filter id="ink" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.03" numOctaves="2" seed="3" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="11" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.35  0 0 0 0 0.36  0 0 0 0.10 0"></feColorMatrix></filter>
</defs>
<rect width="1440" height="900" fill="#ecedf0"></rect>
<rect width="1440" height="900" fill="url(#staff)" filter="url(#ink)"></rect>
<rect width="1440" height="900" filter="url(#grain)"></rect>
</svg>